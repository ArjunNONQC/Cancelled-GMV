<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancelled GMV % — City Dashboard</title>
<style>
  :root{
    --bg: #f7f8f7;
    --panel: #ffffff;
    --ink: #14171a;
    --ink-soft: #5b6268;
    --line: #e3e6e5;
    --accent: #1f6f5c;      /* deep teal — "in control" signal */
    --warn: #b8722c;        /* amber — mid loss */
    --bad: #b6412f;         /* clay red — high loss */
    --bad-bg: #fbeceA;
    --good-bg: #eaf3ef;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{padding:28px 20px 60px;}
  .wrap{max-width:1180px;margin:0 auto;}

  /* Header */
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:18px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
  h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
  .status{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .dot{width:7px;height:7px;border-radius:50%;background:#9aa39d;}
  .dot.live{background:var(--accent);}
  .dot.err{background:var(--bad);}
  #refreshBtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;font-family:var(--sans);font-size:12.5px;cursor:pointer;}
  #refreshBtn:hover{border-color:var(--accent);color:var(--accent);}

  /* Summary tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px;}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .tile .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:8px;}
  .tile .value{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-0.01em;}
  .tile .value.bad{color:var(--bad);}
  .tile .value.accent{color:var(--accent);}

  /* Controls */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
  #search{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:13.5px;background:var(--panel);}
  #search:focus{outline:none;border-color:var(--accent);}
  .sortbar{display:flex;gap:6px;flex-wrap:wrap;}
  .sortbtn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-family:var(--sans);}
  .sortbtn.active{border-color:var(--accent);color:var(--accent);background:var(--good-bg);}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  /* Table */
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);border-bottom:1px solid var(--line);background:#fafbfa;position:sticky;top:0;}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f9faf9;}
  td.city{font-weight:600;letter-spacing:0.01em;}
  td.num{font-family:var(--mono);text-align:right;white-space:nowrap;}
  .lossbar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .lossbar-track{width:70px;height:6px;border-radius:3px;background:#eceeec;overflow:hidden;flex-shrink:0;}
  .lossbar-fill{height:100%;border-radius:3px;}
  .pct-pill{font-family:var(--mono);font-size:12.5px;padding:2px 7px;border-radius:20px;min-width:52px;text-align:right;}

  .empty{padding:40px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .errbox{background:var(--bad-bg);border:1px solid #f0cfc8;color:var(--bad);padding:14px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;font-family:var(--sans);line-height:1.5;}
  .errbox code{font-family:var(--mono);background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px;}

  footer{margin-top:22px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);text-align:center;}

  @media (max-width:600px){
    thead th:nth-child(2), tbody td:nth-child(2){display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">Ops · Cancellations</p>
      <h1>Cancelled GMV % by City</h1>
      <p class="subtitle">Live view — pulled directly from the source sheet</p>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
      <button id="refreshBtn" onclick="loadData()">Refresh</button>
    </div>
  </header>

  <div id="errorSlot"></div>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search a city…" oninput="applyFilters()">
    <div class="sortbar">
      <button class="sortbtn" data-key="loss_gmv_percent" onclick="setSort('loss_gmv_percent')">Loss % ↓</button>
      <button class="sortbtn" data-key="total_gmv" onclick="setSort('total_gmv')">GMV</button>
      <button class="sortbtn" data-key="loss" onclick="setSort('loss')">Loss ₹</button>
      <button class="sortbtn" data-key="customer_city" onclick="setSort('customer_city')">City A–Z</button>
    </div>
    <span class="count" id="rowCount"></span>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>City</th>
          <th>Total GMV</th>
          <th>Loss (₹)</th>
          <th style="text-align:right">Loss GMV %</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No cities match your search.</div>
  </div>

  <footer id="footerNote">—</footer>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw5Q9qRubW1_iZmdt0c7faSYjN0v2Ij0YjaS5amtAX2yQxsaG-2EaEkZ1jYcNApaxNzyA/exec";

let rawData = [];
let sortKey = "loss_gmv_percent";
let sortDir = "desc";

function fmtINR(n){
  if (n === null || n === undefined || isNaN(n)) return "—";
  return "₹" + Math.round(n).toLocaleString("en-IN");
}
function fmtPct(n){
  if (n === null || n === undefined || isNaN(n) || n === "#DIV/0!") return "—";
  return (n*100).toFixed(2) + "%";
}
function lossColor(pct){
  if (pct === null || isNaN(pct)) return {fill:"#c9cdcb", pillBg:"#f1f2f1", pillFg:"var(--ink-soft)"};
  if (pct >= 0.06) return {fill:"var(--bad)", pillBg:"var(--bad-bg)", pillFg:"var(--bad)"};
  if (pct >= 0.025) return {fill:"var(--warn)", pillBg:"#fbf1e6", pillFg:"var(--warn)"};
  return {fill:"var(--accent)", pillBg:"var(--good-bg)", pillFg:"var(--accent)"};
}

function setStatus(state, text){
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  dot.className = 'dot' + (state === 'live' ? ' live' : state === 'err' ? ' err' : '');
  t.textContent = text;
}

async function loadData(){
  setStatus('loading', 'Fetching latest data…');
  document.getElementById('errorSlot').innerHTML = '';
  try{
    const res = await fetch(ENDPOINT, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if(!json.success) throw new Error(json.error || "Unknown error from script");

    rawData = json.data.map(d => ({
      customer_city: d.customer_city,
      total_gmv: Number(d.total_gmv) || 0,
      loss: Number(d.loss) || 0,
      loss_gmv_percent: (typeof d.loss_gmv_percent === 'number') ? d.loss_gmv_percent : null
    }));

    setStatus('live', 'Live · updated ' + new Date(json.timestamp).toLocaleString());
    document.getElementById('footerNote').textContent = 'Source: Apps Script endpoint · ' + rawData.length + ' cities loaded';
    renderTiles(json.summary, rawData);
    applyFilters();
  }catch(err){
    setStatus('err', 'Could not load live data');
    document.getElementById('errorSlot').innerHTML =
      '<div class="errbox"><strong>Couldn\'t reach the sheet.</strong> This usually means the deployment\'s access isn\'t set to "Anyone," or the link is domain-restricted so it won\'t load for people outside your org viewing this page. '
      + 'In Apps Script → Deploy → Manage deployments, confirm "Who has access" is set to Anyone. Details: <code>' + (err.message || err) + '</code></div>';
  }
}

function renderTiles(summary, data){
  // Worst city by absolute loss volume (₹), not by loss %
  const worst = [...data].sort((a,b)=>b.loss-a.loss)[0];

  // avg_loss_percent from the backend is a ratio (e.g. 0.02 means 2%), so it needs ×100 to display correctly
  const avgLossPctDisplay = (Number(summary.avg_loss_percent) * 100).toFixed(2) + '%';
  const avgLossValue = summary.total_cities ? (summary.total_loss / summary.total_cities) : 0;

  const tiles = [
    {label:'Cities tracked', value: summary.total_cities, cls:''},
    {label:'Total GMV', value: fmtINR(summary.total_gmv), cls:'accent'},
    {label:'Total Loss', value: fmtINR(summary.total_loss), cls:'bad'},
    {label:'Avg Loss %', value: avgLossPctDisplay, cls:'bad'},
    {label:'Avg Loss / City', value: fmtINR(avgLossValue), cls:'bad'},
    {label:'Worst city (by loss ₹)', value: worst ? `${worst.customer_city} · ${fmtINR(worst.loss)}` : '—', cls:''},
  ];
  document.getElementById('tiles').innerHTML = tiles.map(t =>
    `<div class="tile"><div class="label">${t.label}</div><div class="value ${t.cls}">${t.value}</div></div>`
  ).join('');
}

function setSort(key){
  if(sortKey === key){
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  }else{
    sortKey = key;
    sortDir = key === 'customer_city' ? 'asc' : 'desc';
  }
  document.querySelectorAll('.sortbtn').forEach(b=>b.classList.toggle('active', b.dataset.key===sortKey));
  applyFilters();
}

function applyFilters(){
  const q = document.getElementById('search').value.trim().toUpperCase();
  let rows = rawData.filter(d => d.customer_city.toUpperCase().includes(q));

  rows.sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(sortKey === 'customer_city'){
      return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    av = (typeof av === 'number') ? av : -Infinity;
    bv = (typeof bv === 'number') ? bv : -Infinity;
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  document.getElementById('rowCount').textContent = rows.length + ' / ' + rawData.length + ' cities';
  renderRows(rows);
}

function renderRows(rows){
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  if(rows.length === 0){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const maxPct = Math.max(...rows.map(r => typeof r.loss_gmv_percent==='number' ? r.loss_gmv_percent : 0), 0.0001);

  tbody.innerHTML = rows.map(r => {
    const pct = r.loss_gmv_percent;
    const numeric = typeof pct === 'number';
    const c = lossColor(numeric ? pct : null);
    const width = numeric ? Math.min(100, (pct / maxPct) * 100) : 0;
    return `<tr>
      <td class="city">${r.customer_city}</td>
      <td class="num">${fmtINR(r.total_gmv)}</td>
      <td class="num">${fmtINR(r.loss)}</td>
      <td class="num">
        <div class="lossbar-cell">
          <div class="lossbar-track"><div class="lossbar-fill" style="width:${width}%;background:${c.fill}"></div></div>
          <span class="pct-pill" style="background:${c.pillBg};color:${c.pillFg}">${fmtPct(pct)}</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

document.querySelector('.sortbtn[data-key="loss_gmv_percent"]').classList.add('active');
loadData();
</script>
</body>
</html>
